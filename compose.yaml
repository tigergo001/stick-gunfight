services:
  stick-gunfight:
    container_name: stick-gunfight
    image: ${SGF_IMAGE:-stick-gunfight:local}
    build:
      context: .
      args:
        NODE_IMAGE: ${SGF_NODE_IMAGE:-node:24-alpine}
    restart: unless-stopped
    environment:
      PORT: "8080"
    expose:
      - "8080"
    volumes:
      - ./data:/app/data
    networks:
      - default
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    external: true
    name: typeflow-production_default
